de:
  lang: German
  forms: plural (nouns), past participle + simple past (verbs), or comparative + superlative (adjectives)
  examples:
    -
      word: folgen
      category: verb
      definition: [
        "to follow (s.o./sth. physically or in sequence)",
        "to follow (a speech/argument) — to keep up with",
        "to follow (s.o.'s example or lead)",
        "to follow/obey (orders, instincts)",
        "to follow/result from (logic) — 'it follows that...'"
      ]
      forms: ["ist gefolgt", "folgte"]
      example: [
          "Geh schon mal vor, ich folg dir gleich nach.",
          "Der Rede konnte ich kaum folgen, weil er so schnell geredet hat.",
          "Sie hat einfach dem Beispiel ihrer Schwester gefolgt und Medizin studiert.",
          "Er folgt immer seinem Bauchgefühl, egal was andere sagen.",
          "Daraus folgt, dass wir den Plan komplett überdenken müssen."
      ]
      reverse: [
          "Go on ahead, I'll follow you in a sec.",
          "I could barely follow the speech because he was talking so fast.",
          "She just followed her sister's example and studied medicine.",
          "He always follows his gut feeling, no matter what others say.",
          "It follows from this that we need to completely rethink the plan."
      ]
    -
      word: das Zuchthaus
      category: noun
      definition: ["prison (for serious crimes, often with hard labor) (!= 'Gefängnis' which is more common and general)"]
      forms: ["die Zuchthäuser"]
      example: [
        "Er wurde zu zehn Jahren Zuchthaus verurteilt, weil er einen Banküberfall geplant hatte.",
      ]
      reverse: [
            "He was sentenced to ten years in prison for planning a bank robbery."
      ]
es:
  lang: Spanish
  forms: plural (nouns), present tense conjugations (verbs), or comparative + superlative (adjectives)
  examples:
    -
      word: quedar
      category: verb
      definition: ["to meet up", "to remain/be left", "to fit (clothing)"]
      forms: ["quedo", "quedas", "queda", "quedamos", "quedáis", "quedan"]
      example: [
          "¿Quedamos mañana para tomar algo?",
          "Después de pagar todas las facturas, me quedaron solo diez euros, así que tuve que cancelar los planes que tenía para el fin de semana.",
          "¿Te queda bien esta camisa? Creo que es un poco grande para mí."
      ]
      reverse: [
          "Shall we meet up tomorrow for a drink?",
          "After paying all the bills, I only had ten euros left, so I had to cancel the plans I had for the weekend.",
            "Does this shirt fit you well? I think it's a bit big for me."
      ]
    -
      word: ponerse
      category: verb
      definition: ["to put on (clothing) (!= 'vestirse')", "to become (a state/emotion, esp. involuntarily or suddenly)"]
      forms: ["me pongo", "te pones", "se pone", "nos ponemos", "os ponéis", "se ponen"]
      example: [
          "Me voy a poner la chaqueta porque hace frío.",
          "Cuando le dije que había perdido las entradas del concierto, se puso súper nervioso y empezó a buscarlas por todas partes como loco."
      ]
      reverse: [
          "I'm going to put on my jacket because it's cold.",
          "When I told him I'd lost the concert tickets, he got super nervous and started looking for them everywhere like crazy."
      ]
